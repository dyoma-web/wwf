# Sveltia CMS configuration — content administration for
# Discover Landscape Finance (landscapefinancehub.org/admin)
#
# Deliberate scope: ONLY the document catalog and key editorial texts.
# Courses, structure and design are managed in code (see Technical Handbook).

backend:
  name: github
  repo: dyoma-web/wwf
  branch: main
  # Auth worker URL (sveltia-cms-auth) — see Technical Handbook §8
  base_url: https://sveltia-cms-auth.wwflandscapefinancehub.workers.dev

media_folder: public/images
public_folder: /images

site_url: https://landscapefinancehub.org

collections:
  - name: documents
    label: Document Library
    description: >-
      Knowledge Hub catalog: each entry appears in the library, the search
      page and the Navigator results. Editorial content (title, description)
      is written in English.
    files:
      - name: catalog
        label: Document Catalog
        file: content/documents.json
        fields:
          - name: lastUpdated
            label: Last updated (YYYY-MM-DD)
            widget: string
            pattern: ['^\d{4}-\d{2}-\d{2}$', 'Required format: YYYY-MM-DD, e.g. 2026-07-27']
            hint: Shown in the note at the bottom of the library.
          - name: docs
            label: Documents
            label_singular: document
            widget: list
            summary: '{{fields.title}}'
            fields:
              - name: id
                label: ID (unique, lowercase and hyphens — never change it after publishing)
                widget: string
                pattern: ['^[a-z0-9-]+$', 'Lowercase letters, numbers and hyphens only']
              - name: title
                label: Title (in English)
                widget: string
              - name: fileName
                label: File name (e.g. my-document.pdf)
                widget: string
              - name: description
                label: Description (2–4 sentences)
                widget: text
              - name: url
                label: Document link (public URL, e.g. Google Drive)
                widget: string
                pattern: ['^https://', 'Must start with https://']
              - name: type
                label: Type
                widget: select
                options:
                  - { label: Case study, value: case-study }
                  - { label: Report, value: report }
                  - { label: Guide, value: guide }
                  - { label: Playbook, value: playbook }
                  - { label: Brief, value: brief }
                  - { label: Briefing paper, value: briefing-paper }
                  - { label: Guidance note, value: guidance-note }
                  - { label: Presentation, value: presentation }
              - name: topic
                label: Topic
                widget: select
                options:
                  - { label: Landscape Finance Basics, value: basics }
                  - { label: Financial Mechanisms & Pipeline, value: mechanisms }
                  - { label: Implementation & Tools, value: implementation }
                  - { label: Conservation Strategy & Mapping, value: strategy }
                  - { label: Food & Agriculture, value: food-agriculture }
              - name: audiences
                label: Audiences (one or more)
                widget: select
                multiple: true
                min: 1
                options:
                  - { label: Investors / fund managers, value: investor }
                  - { label: Practitioners / project developers, value: practitioner }
                  - { label: Corporates, value: corporate }
                  - { label: Policymakers, value: policymaker }
                  - { label: Communities, value: community }
                  - { label: NGOs, value: ngo }
                  - { label: Researchers, value: researcher }
              - name: regions
                label: Regions (one or more)
                widget: select
                multiple: true
                min: 1
                options:
                  - { label: Global, value: global }
                  - { label: Africa, value: africa }
                  - { label: Asia, value: asia }
                  - { label: Latin America, value: latam }
                  - { label: Europe, value: europe }
              - name: countries
                label: Countries (optional)
                widget: list
                required: false
                field: { name: country, label: Country, widget: string }
              - name: financeTypes
                label: Financial instruments (optional)
                widget: select
                multiple: true
                required: false
                options:
                  - { label: Debt / loans, value: debt }
                  - { label: Equity, value: equity }
                  - { label: Grants / philanthropy, value: grants }
                  - { label: Blended finance, value: blended }
                  - { label: Outcome-based, value: outcome-based }
                  - { label: PES, value: pes }
                  - { label: Carbon / biodiversity credits, value: carbon }
                  - { label: Guarantees, value: guarantees }
                  - { label: Microfinance, value: microfinance }
                  - { label: Private investment, value: private-investment }
              - name: tags
                label: Search tags
                widget: list
                field: { name: tag, label: Tag, widget: string }
              - name: featured
                label: Featured in "Global Case Studies"?
                widget: boolean
                required: false
                default: false
              - name: map
                label: Map pin (only for case studies with a location)
                widget: object
                required: false
                collapsed: true
                fields:
                  - name: position
                    label: Coordinates [latitude, longitude]
                    widget: list
                    field: { name: coord, label: Coordinate, widget: number, value_type: float }
                    min: 2
                    max: 2
                  - name: label
                    label: Pin label on the map
                    widget: string

  - name: editorial
    label: Site Texts
    description: >-
      Editorial texts of the pages, in the three languages. Changes are
      published automatically about 2 minutes after saving.
    files:
      - name: texts
        label: Editorial texts (EN · ES · FR)
        file: content/editorial.json
        fields:
          - name: en
            label: English (EN)
            widget: object
            fields:
              - { name: hero_title, label: 'Home — hero title', widget: string }
              - { name: hero_sub, label: 'Home — hero subtitle', widget: text }
              - { name: aboutus_body1, label: 'Home — About Us, paragraph 1', widget: text }
              - { name: aboutus_body2, label: 'Home — About Us, paragraph 2 (mission)', widget: text }
              - { name: discover_body, label: 'Home — "Discover Landscape Finance" paragraph', widget: text }
              - { name: about_body, label: 'Home — "Learning Path" paragraph (agriculture)', widget: text }
              - { name: learning_intro_title, label: 'Learning — intro title', widget: string }
              - { name: learning_intro_body, label: 'Learning — intro paragraph', widget: text }
              - { name: contact_org, label: 'Contact — institutional line', widget: string }
              - { name: contact_loc, label: 'Contact — address', widget: string }
              - { name: contact_phone, label: 'Contact — phone', widget: string }
              - { name: contact_mail, label: 'Contact — emails', widget: string }
          - name: es
            label: Spanish (ES)
            widget: object
            fields:
              - { name: hero_title, label: 'Home — hero title', widget: string }
              - { name: hero_sub, label: 'Home — hero subtitle', widget: text }
              - { name: aboutus_body1, label: 'Home — About Us, paragraph 1', widget: text }
              - { name: aboutus_body2, label: 'Home — About Us, paragraph 2 (mission)', widget: text }
              - { name: discover_body, label: 'Home — "Discover Landscape Finance" paragraph', widget: text }
              - { name: about_body, label: 'Home — "Learning Path" paragraph (agriculture)', widget: text }
              - { name: learning_intro_title, label: 'Learning — intro title', widget: string }
              - { name: learning_intro_body, label: 'Learning — intro paragraph', widget: text }
              - { name: contact_org, label: 'Contact — institutional line', widget: string }
              - { name: contact_loc, label: 'Contact — address', widget: string }
              - { name: contact_phone, label: 'Contact — phone', widget: string }
              - { name: contact_mail, label: 'Contact — emails', widget: string }
          - name: fr
            label: French (FR)
            widget: object
            fields:
              - { name: hero_title, label: 'Home — hero title', widget: string }
              - { name: hero_sub, label: 'Home — hero subtitle', widget: text }
              - { name: aboutus_body1, label: 'Home — About Us, paragraph 1', widget: text }
              - { name: aboutus_body2, label: 'Home — About Us, paragraph 2 (mission)', widget: text }
              - { name: discover_body, label: 'Home — "Discover Landscape Finance" paragraph', widget: text }
              - { name: about_body, label: 'Home — "Learning Path" paragraph (agriculture)', widget: text }
              - { name: learning_intro_title, label: 'Learning — intro title', widget: string }
              - { name: learning_intro_body, label: 'Learning — intro paragraph', widget: text }
              - { name: contact_org, label: 'Contact — institutional line', widget: string }
              - { name: contact_loc, label: 'Contact — address', widget: string }
              - { name: contact_phone, label: 'Contact — phone', widget: string }
              - { name: contact_mail, label: 'Contact — emails', widget: string }
